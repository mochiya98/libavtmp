          fi
          printf 'Building %d dbg targets on shard %s\n' "${#targets[@]}" "${{ matrix.shard }}"
          printf '  %s\n' "${targets[@]}"
          ccache --zero-stats
          make -j9 "${targets[@]}"
          ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: dist-dbg-shard-${{ matrix.shard }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build-dbg-webcodecs-full:
    name: Build full dbg WebCodecs variant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.5
          actions-cache-folder: 'cache-emsdk-dbg'

      - name: Install build tools
