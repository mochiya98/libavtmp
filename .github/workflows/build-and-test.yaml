          if-no-files-found: error
          retention-days: 1

  package-dbg:
    name: Package all dbg variants
    needs: [build-dbg, build-dbg-webcodecs-full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-dbg-*
          path: dist/
          merge-multiple: true

      - name: Verify all dbg variants are present
        shell: bash
        run: |
          set -euo pipefail
