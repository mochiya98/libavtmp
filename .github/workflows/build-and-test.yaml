          cache: npm

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.5
          actions-cache-folder: 'cache-emsdk-dbg'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y meson ccache

      - uses: actions/cache@v4
        name: Cache dbg source archives
        with:
          path: build/*.tar*
          key: sources-dbg-${{ runner.os }}-emcc-6.0.5-shard-${{ matrix.shard }}-${{ hashFiles('mk/*') }}

      - uses: actions/cache@v4
        name: Cache dbg compiler outputs
        with:
          path: .ccache
          key: ccache-dbg-${{ runner.os }}-emcc-6.0.5-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-dbg-${{ runner.os }}-emcc-6.0.5-shard-${{ matrix.shard }}-

      - name: Build assigned dbg variants
        env:
          BUILD_TYPE: dbg
          EM_COMPILER_WRAPPER: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 750M
          CCACHE_COMPRESS: '1'
        run: |
          set -euo pipefail
          targets_file=$(mktemp)
          trap 'rm -f "$targets_file"' EXIT
          # webcodecs is built separately from the full "all" configuration.
          node tools/ci-variant-shard.js "${{ matrix.shard }}" 8 webcodecs > "$targets_file"
          mapfile -t targets < "$targets_file"
          if (( ${#targets[@]} == 0 )); then
            echo "No dbg build targets assigned to shard ${{ matrix.shard }}" >&2
