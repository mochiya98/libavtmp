    strategy:
      fail-fast: true
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
