name: build-and-test
run-name: Build and test ${{ github.sha }}

on:
  push:
  workflow_dispatch:

jobs:
  build-release:
    name: Build release shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.5
          actions-cache-folder: 'cache-emsdk-release'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y meson ccache

      - uses: actions/cache@v4
        name: Cache release source archives
        with:
          path: build/*.tar*
          key: sources-release-${{ runner.os }}-emcc-6.0.5-shard-${{ matrix.shard }}-${{ hashFiles('mk/*') }}

      - uses: actions/cache@v4
        name: Cache release compiler outputs
        with:
          path: .ccache
          key: ccache-release-${{ runner.os }}-emcc-6.0.5-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-release-${{ runner.os }}-emcc-6.0.5-shard-${{ matrix.shard }}-

      - name: Build assigned release variants
        env:
          BUILD_TYPE: release
          EM_COMPILER_WRAPPER: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 750M
          CCACHE_COMPRESS: '1'
        run: |
          set -euo pipefail
          targets_file=$(mktemp)
          trap 'rm -f "$targets_file"' EXIT
          # webcodecs is built separately from the full "all" configuration.
          node tools/ci-variant-shard.js "${{ matrix.shard }}" 8 webcodecs > "$targets_file"
          mapfile -t targets < "$targets_file"
          if (( ${#targets[@]} == 0 )); then
            echo "No release build targets assigned to shard ${{ matrix.shard }}" >&2
            exit 1
          fi
          printf 'Building %d release targets on shard %s\n' "${#targets[@]}" "${{ matrix.shard }}"
          printf '  %s\n' "${targets[@]}"
          ccache --zero-stats
          make -j9 "${targets[@]}"
          ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: dist-release-shard-${{ matrix.shard }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build-release-webcodecs-full:
    name: Build full release WebCodecs variant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.5
          actions-cache-folder: 'cache-emsdk-release'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y meson ccache

      - uses: actions/cache@v4
        name: Cache release source archives
        with:
          path: build/*.tar*
          key: sources-release-${{ runner.os }}-emcc-6.0.5-webcodecs-full-${{ hashFiles('mk/*') }}

      - uses: actions/cache@v4
        name: Cache release compiler outputs
        with:
          path: .ccache
          key: ccache-release-${{ runner.os }}-emcc-6.0.5-webcodecs-full-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-release-${{ runner.os }}-emcc-6.0.5-webcodecs-full-

      - name: Configure release WebCodecs with all supported components
        shell: bash
        run: |
          set -euo pipefail
          full_config=$(<configs/configs/all/config.json)
          (
            cd configs
            node mkconfig.js webcodecs "$full_config"
          )
          cmp configs/configs/all/config.json configs/configs/webcodecs/config.json

      - name: Build full release WebCodecs variant
        env:
          EM_COMPILER_WRAPPER: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1500M
          CCACHE_COMPRESS: '1'
        run: |
          set -euo pipefail
          ccache --zero-stats
          make -j9 build-release-webcodecs
          ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: dist-release-webcodecs-full
          path: dist/
          if-no-files-found: error
          retention-days: 1

  package-release:
    name: Package all release variants
    needs: [build-release, build-release-webcodecs-full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-release-*
          path: dist/
          merge-multiple: true

      - name: Verify all release variants are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for dir in configs/configs/*; do
            variant=${dir##*/}
            if [[ ! -f "dist/libav-${variant}.js" ]]; then
              echo "Missing dist/libav-${variant}.js" >&2
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-all-release-variants-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  build-dbg:
    name: Build dbg shard ${{ matrix.shard }}
